name: APK 만들기

on:
  push:
    branches: [main]
    paths: ["index.html", "icon_*.png", "android.zip", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 안드로이드 프로젝트 압축 풀기
        run: unzip -q -o android.zip

      - name: 웹 버전(index.html)을 앱 안에 복사
        run: |
          python3 - <<'PY'
          import re
          h = open("index.html", encoding="utf-8").read()
          # 앱 안에서는 웹 전용 줄(서비스워커·매니페스트)이 필요 없음
          h = re.sub(r'<link rel="manifest"[^>]*>\n?', '', h)
          h = re.sub(r'<script>if\("serviceWorker".*?</script>\n?', '', h)
          open("android/app/src/main/assets/index.html", "w", encoding="utf-8").write(h)
          PY

      - name: APK 빌드
        working-directory: android
        run: gradle assembleRelease -Pvc=${{ github.run_number }}

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk KUH1_암기카드.apk

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: KUH-1 암기카드 v1.${{ github.run_number }}
          body: 휴대폰에서 아래 KUH1_암기카드.apk를 눌러 내려받아 설치하세요.
          files: KUH1_암기카드.apk
          make_latest: true
