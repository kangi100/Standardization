<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KUH-1 표준화평가 문제안</title>
<style>
:root{
  --paper:#FBFBF8;--sheet:#FFFFFF;--ink:#1E2A44;--sub:#5B6478;--line:#D9DCE3;
  --omr:#C8102E;--omr-bg:#FCECEE;--ok:#2F7D4F;--ok-bg:#E8F3EC;--hi:#F3F5F9;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Noto Serif KR","AppleMyungjo","Batang",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151A24;--sheet:#1C2230;--ink:#E7EAF1;--sub:#9AA3B5;--line:#2E3647;
  --omr:#FF6B7F;--omr-bg:#3A1E25;--ok:#6CC08E;--ok-bg:#1D3326;--hi:#232A3A}}
:root[data-theme="dark"]{--paper:#151A24;--sheet:#1C2230;--ink:#E7EAF1;--sub:#9AA3B5;--line:#2E3647;
  --omr:#FF6B7F;--omr-bg:#3A1E25;--ok:#6CC08E;--ok-bg:#1D3326;--hi:#232A3A}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--ink)}
.hd{max-width:720px;margin:0 auto;padding:12px 16px 0}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.title h1{font-family:var(--serif);font-size:1.18rem;margin:0;letter-spacing:-.01em}
.title small{color:var(--sub);font-size:.8rem}
.sets{display:flex;gap:0;margin-top:10px}
.sets button{flex:1;border:0;background:none;padding:8px 0 10px;font-weight:600;font-size:1rem;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-2px}
.sets button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--omr)}
.sets button:disabled{opacity:.4;cursor:default}
.sets button span{display:block;font-size:.7rem;font-weight:400}

.modes{display:flex;gap:8px;margin:16px 0 12px}
.modes button{flex:1;padding:11px 8px;border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;font-weight:600}
.modes button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

.empty{background:var(--sheet);border:1.5px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;color:var(--sub)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:6px}

/* booklet */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px;font-size:.88rem;color:var(--sub)}
.switch{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem;color:var(--ink)}
.switch i{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-pressed="true"] i{background:var(--omr)}
.switch[aria-pressed="true"] i::after{left:14px}
details.subj{background:var(--sheet);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
details.subj>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:700;cursor:pointer}
details.subj>summary::-webkit-details-marker{display:none}
details.subj>summary::after{content:"＋";color:var(--sub);font-weight:400}
details.subj[open]>summary::after{content:"－"}
details.subj>summary small{color:var(--sub);font-weight:400;margin-left:6px}
.qs{border-top:1px solid var(--line)}
.q{padding:14px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.qt{font-family:var(--serif);font-weight:500;white-space:pre-line;margin:0 0 8px}
.qt .no{font-family:var(--sans);font-weight:700;margin-right:6px}
.kind{display:inline-block;font-family:var(--sans);font-size:.72rem;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.ch{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ch li{display:flex;gap:8px;padding:4px 6px;border-radius:6px}
.ch li .k{flex:none;font-weight:600}
.ch li.right{background:var(--ok-bg);color:var(--ok);font-weight:600}
.blank{display:inline-block;min-width:2.4em;border-bottom:1.5px solid var(--ink);text-align:center;font-family:var(--sans);font-weight:600;font-size:.85em;padding:0 4px}
.blank.show{color:var(--ok);border-color:var(--ok)}
.ans{margin-top:8px;padding:8px 10px;border-left:3px solid var(--ok);background:var(--ok-bg);border-radius:0 6px 6px 0;font-size:.92rem;white-space:pre-line}
.ans b{color:var(--ok)}
.reveal{margin-top:8px;border:1.5px dashed var(--line);background:none;border-radius:6px;padding:6px 12px;font-size:.85rem;color:var(--sub)}
.note{margin-top:6px;font-size:.82rem;color:var(--sub);white-space:pre-line}

/* exam */
.start{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px 18px}
.start h2{font-family:var(--serif);margin:0 0 4px;font-size:1.3rem}
.start p{margin:0 0 14px;color:var(--sub);font-size:.9rem}
.start table{width:100%;border-collapse:collapse;font-size:.9rem;margin-bottom:16px}
.start td{padding:6px 0;border-bottom:1px solid var(--line)}
.start td:last-child{text-align:right;font-weight:600}
.primary{width:100%;padding:14px;border:0;border-radius:10px;background:var(--omr);color:#fff;font-weight:700;font-size:1.02rem}
.ghost{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);font-weight:600;margin-top:8px}
.hist{margin-top:14px;font-size:.85rem;color:var(--sub)}
.hist li{margin:2px 0}

.exbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:4;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px;font-size:.88rem}
.exbar .t{font-variant-numeric:tabular-nums;font-weight:700}
.exbar .p{color:var(--sub)}
.exbar button{border:1.5px solid var(--omr);color:var(--omr);background:var(--sheet);border-radius:8px;padding:6px 12px;font-weight:700}
.eq{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.eq .sj{font-size:.75rem;color:var(--sub);margin-bottom:4px}
.omr{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.omr button{display:flex;align-items:flex-start;gap:10px;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:9px 10px}
.omr .bub{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);display:inline-flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;margin-top:-1px}
.omr button[aria-pressed="true"]{border-color:var(--omr);background:var(--omr-bg)}
.omr button[aria-pressed="true"] .bub{background:var(--omr);color:#fff}
.inp{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.inp label{display:flex;align-items:center;gap:8px;font-size:.9rem}
.inp input,.inp textarea{flex:1;font:inherit;font-size:.95rem;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0}
.inp textarea{min-height:84px;resize:vertical;width:100%}

/* result */
.score{background:var(--sheet);border:2px solid var(--ink);border-radius:12px;padding:18px;text-align:center;margin-bottom:12px}
.score .big{font-family:var(--serif);font-size:3rem;line-height:1;font-weight:700}
.score .big small{font-size:1.1rem;color:var(--sub);font-weight:500}
.score .meta{color:var(--sub);font-size:.88rem;margin-top:6px}
.bysub{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0 14px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bysub th,.bysub td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.bysub td:not(:first-child),.bysub th:not(:first-child){text-align:right}
.mark{font-weight:700}
.mark.o{color:var(--ok)}.mark.x{color:var(--omr)}
.rq{background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--omr);border-radius:8px;padding:12px;margin-bottom:8px}
.rq.ok{border-left-color:var(--ok)}
.rq .mine{font-size:.88rem;color:var(--omr);margin-top:6px}
.self{display:flex;gap:6px;margin-top:8px}
.self button{flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--sheet);font-weight:600;font-size:.88rem}
.self button.o[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.self button.x[aria-pressed="true"]{border-color:var(--omr);background:var(--omr-bg);color:var(--omr)}
.filter{display:flex;gap:6px;margin:6px 0 10px}
.filter button{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:.85rem}
.filter button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:20}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.title h1 .lv{font-family:var(--sans);font-size:.72rem;font-weight:700;color:var(--omr);border:1.5px solid var(--omr);border-radius:4px;padding:0 5px;vertical-align:3px;margin-left:4px}
.stdbox{background:var(--sheet);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.stdbox>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:600;font-size:.92rem;cursor:pointer}
.stdbox>summary::-webkit-details-marker{display:none}
.stdbox .warn{color:var(--omr);font-size:.85rem}.stdbox .good{color:var(--ok);font-size:.85rem}
.stdbox .std{margin:0;border-top:1px solid var(--line)}
table.std{width:100%;border-collapse:collapse;font-size:.88rem;margin-bottom:14px}
table.std th,table.std td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right}
table.std th:first-child,table.std td:first-child{text-align:left}
table.std th{color:var(--sub);font-weight:500;font-size:.8rem}
table.std tr.sum td{font-weight:700;border-bottom:0}
table.std td.short{color:var(--omr);font-weight:600}
table.std td.over{color:#B7791F;font-weight:600}
table.std td.okc{color:var(--ok)}
.warnp{color:var(--omr)!important;font-size:.85rem!important}
.kind.settag{color:var(--omr);border-color:var(--omr);font-weight:600}
.ordsw{display:flex;align-items:center;gap:6px;margin:0 0 14px;font-size:.88rem}
.ordsw span{color:var(--sub);margin-right:auto}
.ordsw button{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem}
.ordsw button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.allnote{color:var(--sub);font-size:.88rem;margin:0 0 10px}
.sets button span{white-space:nowrap}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,15,25,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--sheet);color:var(--ink);border-radius:14px;padding:20px 18px 14px;max-width:360px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.mbox p{margin:0 0 16px;line-height:1.55}
.mbtn{display:flex;gap:8px}
.mbtn button{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);font-weight:700}
.mbtn .yes{background:var(--omr);border-color:var(--omr);color:#fff}
</style>
<link rel="icon" type="image/png" href="icons/icon_192.png">
<meta name="theme-color" content="#1F3A56">
</head>
<body>
<header>
  <div class="hd">
    <div class="title"><h1>KUH-1 표준화평가 문제안 <span class="lv">CP/P</span></h1><small id="setInfo"></small></div>
    <nav class="sets" role="tablist" id="sets"></nav>
  </div>
</header>
<main class="wrap">
  <div class="modes" id="modes">
    <button data-m="book" aria-pressed="true">자료집</button>
    <button data-m="exam" aria-pressed="false">실전 시험</button>
  </div>
  <section id="view"></section>
</main>
<div class="toast hidden" id="toast" role="status"></div>
<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="mdMsg"><div class="mbox"><p id="mdMsg"></p><div class="mbtn"><button id="mdNo">취소</button><button id="mdYes" class="yes">확인</button></div></div></div>

<script>
/* =========================================================
   문제 데이터
   형식: {s:"과목", n:번호, t:"mc"|"fill"|"write", q:"문제", o:[보기], a:[정답], e:"해설"}
   - mc   : a = 정답 보기 번호(0부터) 배열
   - fill : q 안의 {} 자리가 빈칸, a = 빈칸 정답 배열 (자동 채점)
   - write: a = 모범답안 문자열 (스스로 채점)
   ========================================================= */
const SETS={
  A:{label:"A안",ready:false,cards:[]},
  B:{label:"B안",ready:true,cards:[{"s":"사용자교범","n":1,"t":"mc","q":"FMU의 기능은 무엇인가?","a":[2],"o":["오일순환","공기 압축","연료 펌핑 및 가압","기체 전원제공"],"e":"기존 문제 : 사용자교범 선택형 2번\n📖 교범 p.2-30, 2-3-2.2.4\nFMU 기능: 연료 펌핑 및 가압, EECU 신호에 따른 VG 작동·연료공급량 조절, 과속·정상 정지 신호 시 연료공급 차단, 최대 연료공급량 제한, 엔진 정지 시 연료압력 제거, EECU에 NG·연료조절밸브 위치·연료온도 신호 송출 등\n\nFMU = 연료 펌핑 및 가압."},{"s":"사용자교범","n":2,"t":"mc","q":"한쪽 엔진이 시동 상태이면 그 엔진으로 NR 100% 및 Collective up T/Q 60% 이상 유지하여 상대 엔진을 Cross bleed 시동할 수 있다. 이때 추가로 확인하여야 할 사항을 고르시오.","a":[1],"o":["AIR SOURCE 스위치 APU, 시동 상태 엔진 ENGINE ANTI-ICE 조언등 OFF","AIR SOURCE 스위치 ENG, 시동 상태 엔진 ENGINE ANTI-ICE 조언등 OFF","AIR SOURCE 스위치 OFF, 시동 상태 엔진 ENGINE ANTI-ICE 조언등 ON","AIR SOURCE 스위치 OFF, 시동 상태 엔진 ENGINE ANTI-ICE 조언등 OFF"],"e":"기존 문제 : 사용자교범 선택형 24번\n📖 교범 p.2-35, 2-3-6.6\nAIR SOUR 스위치 ENG → 각 엔진의 공기차단 밸브(Pneumatic Shutoff Valve)가 모두 열림\n\nCross bleed 시동 조건: NR 100%, T/Q 60% 이상, AIR SOURCE = ENG, 시동 엔진 ANTI-ICE 조언등 OFF."},{"s":"사용자교범","n":3,"t":"mc","q":"테일 로터 작동기는 테일 기어박스에 1개가 장착되어 있다. 후방 쿼드런트를 통해 들어온 페달 조종입력은 입력 레버를 거치면서 유압에 의해 증폭되는데 비행 중 주의경고 패널에 “1T/R ACT” 혹은 “2T/R ACT” 주의등이 점등되었다면 해당되는 경우는?","a":[2],"o":["조종입력된 유압이 입력 레버를 거치면서 과도하게 증폭되었다.","좌·우측 4개의 케이블 중 한쪽이 절단되었다.","제어 밸브가 고착되거나 유압이 손실되었다.","전방 쿼드란트의 4개의 케이블 절단 감지기 중 한 개라도 기능이 저하되었다."],"e":"기존 문제 : 사용자교범 선택형 30번\n📖 교범 p.2-47, 2-5-2.8\n작동기는 2단계 직렬형, 각 단계 유압 독립 공급. 제어 밸브 고착 또는 유압 손실 시 1 T/R ACT 또는 2 T/R ACT 점등\n\n1T/R ACT·2T/R ACT = 제어 밸브 고착 또는 유압 손실."},{"s":"사용자교범","n":4,"t":"mc","q":"비행자료기록장치(FDR)는 항전장비실 하부에 장착되어 있다. 다음 중 FDR에 대한 설명이 잘못된 것은?","a":[1],"o":["FDR 구성품 중 극한 보호 기억장치(CPM)은 25시간(개조후 76시간) 분량의 비행 항법 자료와 2시간(개조후 35시간) 분량의 음성자료를 저장할 수 있다.","CPM에 기록된 데이터는 해수깊이 20,000ft에서 45일 이상 보존된다.","CPM의 외부에 “FLIGHT RECORDER DO NOT OPEN”이라는 문자는 수중에서도 식별이 용이하도록 광반사형태로 부착되어 있다.","음파 추적용 비콘은 내부의 자체 배터리를 이용하여 독립적으로 작동하므로 FDR과의 전기적 인터페이스는 없다."],"e":"기존 문제 : 사용자교범 선택형 41번\n📖 교범 p.2-80, 2-10-7.2\nCPM 데이터는 해수깊이 20,000ft에서 30일 이상 보존 (→ 45일이 틀림)\n\n틀린 보기: 나(해수 보존 조건).\n옳은 내용: CPM 비행자료 25시간(개조후 76), 음성 2시간(개조후 35), 광반사 문자, 비콘은 자체 배터리·전기적 인터페이스 없음."},{"s":"사용자교범","n":5,"t":"mc","q":"HMDS의 정렬절차 설명 중 틀린 것은 무엇인가?","a":[2],"o":["HMDS의 정렬절차는 일반정렬과 미세정렬로 구분된다.","시현기 및 NVG를 먼저 조절한 다음 착석 위치에서 LOS 정렬을 수행해야 한다.","일반정렬 수행시 HMD 센터 스위치를 길게 누를 때마다 FINE ALN AZ/EL과 FINE ALN ROLL이 전환된다.","시선정렬 확인을 위한 목표점은 1km 이상 거리의 식별이 용이한 지형지물을 선택한다."],"e":"기존 문제 : 사용자교범 선택형 53번\n📖 교범 p.4-59, 4-5-2.6.5.2 주(注) 1 — HMD 센터 스위치를 길게 누를 때마다 FINE ALN AZ/EL과 FINE ALN ROLL 전환\n라: p.4-60, 4-5-2.6.7 주(注)\n\n틀린 보기: 다. FINE ALN(미세정렬) 항목 전환을 ‘일반정렬’로 설명함.\n옳은 내용: 일반정렬·미세정렬 구분, 시현기·NVG 조절 후 LOS 정렬, 목표점 1km 이상."},{"s":"사용자교범","n":6,"t":"mc","q":"두 엔진 고장이 발생하면 메인 로터 회전속도가 급격히 줄어들며 항공기는 우측 편요가 일어난다. 지면 가까이가 아니면 즉시 자동회전 강하를 수행해야 한다. 자동회전 강하 시 추천하는 속도와 최대활공비를 얻기 위한 속도는 얼마인가?","a":[1],"o":["65 / 100KIAS","75 / 100KIAS","85 / 100KIAS","95 / 100KIAS"],"e":"기존 문제 : 사용자교범 선택형 65번\n📖 교범 p.9-5, 9-1-2.5.1항\n\n자동회전: 추천 속도 75KIAS / 최대활공비 100KIAS.\n두 엔진 고장 시 우측 편요."},{"s":"사용자교범","n":7,"t":"fill","q":"조종실 출입문 사용 제한: 조종실 출입문을 제거하고 비행하는 것은 {}한다. 조종실 출입문의 {}은 {}을 제외하고 비행중에 {} 안 된다.","a":["금지","미닫이 창","제자리비행","열거나 닫아서는"],"e":"기존 문제 : 사용자교범 완성형 23번"},{"s":"사용자교범","n":8,"t":"fill","q":"로터 시동 및 정지 한계: 엔진 시동으로 로터를 회전시키거나 엔진 정지로 로터를 정지시킬 수 있는 최대 풍속은 정풍 {}, 측풍 {}, 배풍 {}이다.","a":["45 kt","30 kt","25 kt"],"e":"기존 문제 : 사용자교범 완성형 25번\n정풍 45 / 측풍 30 / 배풍 25 (5씩 줄지 않음에 주의)."},{"s":"사용자교범","n":9,"t":"fill","q":"로터 브레이크 제한사항\n가. 정상제동은 엔진 정지 후 {}에서 사용해야 한다.\n나. 긴급제동은 엔진 정지 후 {}에서 적용하며 이후 비행을 금지한다.\n다. 주기를 위한 제동 시 최소압력이 2,176psi({})일 때 {}동안 가능하며, 추가 주기제동을 위해서는 압력을 재충전해야 한다.\n라. 로터 브레이크의 작동 제한 압력 2,465psi({})를 초과해서는 안 된다.","a":["NR 50% 미만","NR 50% ~70% 미만","150 bar","24시간","170 bar"],"e":"기존 문제 : 사용자교범 완성형 26번\n선택형 6번(166BAR 틀림)·10번(정상제동 조건 틀림)의 정답 근거.\n정상제동 NR 50% 미만 / 긴급제동 50~70% 미만."},{"s":"사용자교범","n":10,"t":"fill","q":"MGB TEMP 주의등 점등시 원인과 조치사항을 기재하시오.\n- {} 또는 {}이 원인일 수 있다. MGB TEMP 주의등이 5분 이상 계속 점등될 경우 두 엔진 토크는 55% 이하를 유지해야 한다.\n- 조치절차\n1. 속도 - {}\nMGB TEMP 주의등이 {} 계속 점등될 경우\n2. {}\nMGB TEMP 주의등이 소등될 경우\n3. {}","a":["MGB 오일량 부족","오일냉각장치의 고장","75KIAS 이하로 조절","5분 이상","LAND AS SOON AS PRACTICABLE","계속비행"],"k":"write","e":"기존 문제 : 사용자교범 기재형 10번"},{"s":"항공기 승무원훈련","n":11,"t":"mc","q":"항공기 승무원 협조란 안전하고 효율적이며 효과적인 임무 수행을 위해 항공기 승무원(조종사, 승무병, 비행의무요원 등) 간의 협력적인 상호작용을 말한다. 항공기 승무원 협조 중 ‘목표’에 대한 요소와 관련이 없는 것은?","a":[2],"o":["팀 관계 확립 및 유지","효율적인 임무관리","인지행동","교차 감시 수행"],"e":"기존 문제 : 항공기 승무원훈련 선택형 2번\n📖 교범 p.1-8~11\n승무원 협조 원칙: 명확한 교신, 조력지시, 행동통보, 조력제공, 인지행동, 명확한 용어사용, 항공기 조종 및 장애물 조언, 행동 순서 및 시기협조(순서와 타이밍)\n승무원 협조 목표: 팀 관계 확립 및 유지, 효율적인 임무 관리, 정보 교환, 교차 감시 수행\n\n인지행동은 ‘원칙’ 쪽 요소 (3번과 비교)."},{"s":"항공기 승무원훈련","n":12,"t":"mc","q":"아래에 기술된 조치사항에 해당되는 적 위협을 올바르게 설명된 것은?\n[채프를 발사하고 즉각적인 90° 급선회 및 엄폐 지역으로 기동, 엄폐 불가하면 10초 이상 동고도 직진 수평비행 금지. NOE 비행고도로 강하]","a":[3],"o":["전투기","열 추적 미사일","탱크 및 로켓 추진 수류탄(RPG)","대구경 화기, 대공화기(레이다 조종)"],"e":"기존 문제 : 항공기 승무원훈련 선택형 9번\n📖 교범 p.2-263\n과제 2008 적 조우시 행동 — 각 화기 형태별 조우시 절차\n\n‘채프’ = 레이더 대응 → 레이더 조종 대공화기."},{"s":"항공기 승무원훈련","n":13,"t":"mc","q":"은폐(차폐) 및 노출은 적의 관측이나 화기 사격으로부터 항공기를 차폐해야 할 경우에는 은폐(차폐)기동을 하며, 은폐된 위치에서는 관측이 어려운 관심지역에 대한 관측이 필요한 경우에는 노출기동을 실시한다. 노출간 모든 시선을 외부에 집중할 수 있도록 노출 실시전에 철저한 도상정찰을 실시해야 한다. 다음 중 일반적인 세 가지 노출(Unmasking) 방법이 아닌 것은?","a":[3],"o":["비행 중 노출","제자리비행 수직 노출","제자리비행 수평 노출","수직상승 노출"],"e":"기존 문제 : 항공기 승무원훈련 선택형 38번\n📖 교범 p.2-258~259\n\n노출 3가지: 비행 중 / 제자리비행 수직 / 제자리비행 수평."},{"s":"항공기 승무원훈련","n":14,"t":"mc","q":"급속헬기로프 하강(Fast Rope) 요원(Roper)이 신속하게 강하 시 양쪽 로프줄에 동시에 몇 명까지 가능한가?","a":[1],"o":["3명","4명","6명","8명"],"e":"기존 문제 : 항공기 승무원훈련 선택형 39번\n📖 교범 p.2-318\n작년 문항: 패스트로프 바 이용 시 한쪽 로프에 동시 강하 최대 2명 (→ 양쪽 합계 4명)\n\n양쪽 로프 동시 4명."},{"s":"항공기 승무원훈련","n":15,"t":"fill","q":"성능계획표를 재작성해야 할 경우 계산된 값은 동력 값(토크)은 ({})%, 무게값은 ({}) lb, 연료소모량은 시간당 ({}) lb, 속도는 ({})kt의 조건 내에 있어야 한다.","a":["±2","±500","±100","±5"],"e":"기존 문제 : 항공기 승무원훈련 완성형 49번\n📖 교범 p.2-26\n재작성 조건: 외기온도(FAT) ±5°C / 기압고도(PA) ±1,000ft / 총중량(GWT) ±500 lbs / 엔진 동력비(ETF) 0.05 → 이륙 당시의 정확한 조건으로 다시 계산\n재작성 시 계산값 허용: 동력(TQ) ±2% / 무게 ±500 lbs / 연료소모량 시간당 ±100 lbs / 속도 ±5kt\n작년 손글씨 암기법: 재작성 조건 ‘5·1·5·5’, 계산값 ‘2·5·1·5’\n\n기재형 5번(재작성 조건: 외기온도 ±5°C, 기압고도 ±1,000ft, 총중량 ±500 lb, 엔진동력비 0.05)과 함께 암기."},{"s":"항공기 승무원훈련","n":16,"t":"fill","q":"표준(기준)은 각 과제 수행을 위해 최소한 수행능력의 정도를 설명하는 것을 말한다. 과제에 특별히 명시하지 않았다면 공통적으로 적용되는 사항으로 항공기 승무원은 이러한 표준(기준)을 초과하기 전에 편류나 고도변화를 사전에 알려 주어야 한다. 제자리 비행시 적용되는 요구되는 기수방향, 요구되는 고도, 편류에 대하여 기재하시오.\n가. {}\n나. {}\n다. {}\n라. 현 상황에 적절한 일정한 변화율 유지","a":["요구되는 기수방향 ±10도 유지","요구되는 고도 ±3ft (OGE ±10ft) 유지","3ft 이상 편류 금지 (OGE 10ft)"],"k":"write","e":"기존 문제 : 항공기 승무원훈련 기재형 4번\n제자리비행: 기수 ±10° / 고도 ±3ft(OGE ±10ft) / 편류 3ft(OGE 10ft)."},{"s":"정비학","n":17,"t":"mc","q":"통신 및 피아식별 계통은 U/VHF-AM 무전기, VHF-FM 무전기, 내부통화장치(ICS), 비화장비(COMSEC) 및 피아식별 장비(IFF)로 구성된다. 그 중 VHF-FM 무전기는 육군 관제소 또는 C4ISR 통신수단으로 주로 사용되고 U/VHF-AM 무전기는 민간 또는 공군관제소와의 통신수단으로 주로 사용된다. VHF-FM 무전기는 2대가 장착되어 1대는 음성 송수신용, 나머지 1대는 음성 송수신 또는 지상 C4ISR과의 연동을 위한 어떠한 통신이 가능한가?","a":[3],"o":["내부통신 기능","쌍방향 통신","도약통신","데이터 통신"],"e":"기존 문제 : 정비학 선택형 2번\n📝 메모 — VHF-FM 무전기 2대\n· 1대: 음성 송수신용\n· 나머지 1대: 음성 송수신 또는 데이터 송수신용\n\nVHF-FM 2대: 1대 음성 송수신, 나머지 1대 음성 또는 지상 C4ISR 연동 데이터 통신.\nVHF-FM = 육군 관제소·C4ISR / U/VHF-AM = 민간·공군 관제소."},{"s":"정비학","n":18,"t":"mc","q":"상태감시장치(HUMS)는 항공기의 상태(Health)와 운용(Usage) 정보를 감시, 획득, 처리 및 저장하며 주의(Caution), 초과사항(Exceedance) 및 항공기운용 이력은 조종실 내의 감지데이터 시현장치(PIP)에 시현된다. HUMS는 DAPU, PIP, CQAR, 트랙커 및 센서로 구성된다. DAPU는 동력전달계통 및 엔진의 진동, 로터 트랙과 균형, 진동 및 항공기 상태 데이터 신호를 디지털 신호로 변환한 후 CQAR에 전송하는 역할을 한다. HUMS의 주요 감시항목이 아닌 것은?","a":[3],"o":["엔진, 동력전달계통, 로터 및 기체 진동상태","엔진, 각 기어박스, 로터, 유압장치의 초과사항 및 칩 발생","로터 트랙 및 밸런스, 동력전달계통 주요 구성품의 주의 조건 발생","항공기 기체 시간"],"e":"기존 문제 : 정비학 선택형 9번\n📖 교범 UM p.2-78\n\n감시항목 아님: 항공기 기체 시간.\nHUMS 구성: DAPU·PIP·CQAR·트랙커·센서."},{"s":"정비학","n":19,"t":"mc","q":"메인 기어박스는 항공기 상부 데크의 중앙에 위치하며 3개의 스트러트바와 스프링 플레이트로 지지되어 있으며 전방으로 5° 기울어져 있다. 주 구동축 후방에 프리휠 클러치가 장착되어 엔진동력을 사용하지 않을 때 엔진과의 연결을 차단한다. 메인 기어박스 상부의 에피사이클릭 감속기어 상자는 여러 개의 선기어와 위성 기어로 감속하여 메인 로터 마스트를 회전시킨다. 메인 로터 마스트의 감속비는?","a":[3],"o":["269RPM / 86:1","270RPM / 87:1","271RPM / 87:1","272RPM / 87:1"],"e":"기존 문제 : 정비학 선택형 10번\n📖 교범 UM p.2-66\n\n메인 로터 마스트 272RPM / 87:1.\nMGB: 스트러트바 3개, 전방 5° 기울어짐."},{"s":"정비학","n":20,"t":"mc","q":"동력전달계통의 결함, 운용상태, 필수정보, 동작 상태 및 허용한계는 MFD, IVI 및 CWP를 통하여 시현된다. 메인 기어박스의 오일 온도 및 압력, 각 기어박스의 철분 탐지 정보는 MFD와 IVI에 시현되며 화재, 오일 온도 및 압력 비정상, 철분탐지 등 정·부조종사에게 제공되어야 할 주요 구성품의 비정상 상태는 어디에 시현되는가?","a":[1],"o":["통합형 항공계기(IVI)","주의 경고패널(CWP)","다기능 시현기(MFD)","엔진 지시계통(EICAS)"],"e":"기존 문제 : 정비학 선택형 12번\n정상 정보 → MFD·IVI / 비정상 상태 → CWP."},{"s":"정비학","n":21,"t":"mc","q":"메인 로터 제동장치는 엔진 시동에서 IDLE까지 진행되는 동안 메인 로터와 테일 로터를 정지시켜 두거나 시동 정지 시 무동력 상태에서 로터 회전을 신속하게 종료시키기 위해 사용한다. 레버의 위치는 동적 제동 위치와 정적제동 위치로 구분된다. 레버를 전방으로 약 58° 밀면 딸깍하는 소리와 함께 동적 제동 위치에 멈춘다. 로터 브레이크 작동 시 초과해서는 안되는 압력은 얼마인가?","a":[0],"o":["2,465PSI(170BAR)","2,365PSI(163BAR)","2,245PSI(155BAR)","2,100PSI(145BAR)"],"e":"기존 문제 : 정비학 선택형 19번\n📖 교범 UM p.2-71\n\n초과 금지 압력 2,465PSI(170BAR).\n동적 제동 위치 = 전방 약 58°."},{"s":"정비학","n":22,"t":"mc","q":"카울링이 완전히 닫히지 않고 개방되어 있으면 카울링 센서 스위치와 후방 슬라이딩 카울링 조립체의 걸쇠가 정확히 접지되지 않아 카울링 개방상태를 ‘ON·OFF’의 이산신호로 DAU로 전달한다. 획득된 자료는 DVI 신호처리에 따라 시현되는 계기는?","a":[1],"o":["MFD","IVI","CWP","MWP"],"e":"기존 문제 : 정비학 선택형 22번\n카울링 개방 신호 → DAU → IVI 시현."},{"s":"정비학","n":23,"t":"mc","q":"메인 기어박스(MGB)로부터 엔진 구동력을 전달받아 유압이 필요한 유압장치와 비행 조종장치에 공급하는 유압은 얼마인가?","a":[2],"o":["2,000PSI","2,200PSI","3,000PSI","3,200PSI"],"e":"기존 문제 : 정비학 선택형 31번\n📖 교범 UM p.2-61\n\n유압 공급 3,000PSI."},{"s":"정비학","n":24,"t":"mc","q":"701K 엔진의 압축기 형태는?","a":[3],"o":["축류 5단계 원심 2단계","축류 4단계 원심 1단계","축류 6단계 원심 1단계","축류 5단계 원심 1단계"],"e":"기존 문제 : 정비학 선택형 35번\n📖 교범 UM p.2-22\n\n701K 압축기: 축류 5단 + 원심 1단."},{"s":"정비학","n":25,"t":"fill","q":"통합헬멧 시현 장치{}는 최신형의 주·야간 통합헬멧 장착형 시현 장치로 외부 영상 이미지와 겹쳐지는 중요 비행, 감지기 및 임무 정보에 대한 비행 기호를 생성하여 주간 및 야간용 전방 시현장치(Day/Night-HUD)를 통해 조종사의 시야 전방에 시현시킨다. {}는 외부 시계 정보와 중요 비행 정보를 하나의 시현기 상에 조합하여 시현함으로써 조종사가 항공기 계기를 계속 주시해야 하는 필요성을 없애준다. 또한, HMDS에는 조종사의 {}을 탐지하는 전자기(EM) 헤드 추적기가 탑재되어 있다.","a":["HMDS","HMDS","LOS"],"e":"기존 문제 : 정비학 완성형 3번\nLOS = 조종사 시선(Line of sight)."},{"s":"기초비행원리","n":26,"t":"mc","q":"다음 중 유해항력에 포함되지 않는 것은?","a":[1],"o":["형상항력","유도항력","마찰항력","간섭항력"],"e":"기존 문제 : 기초비행원리 선택형 13번"},{"s":"기초비행원리","n":27,"t":"mc","q":"공기 중을 통과하는 로터 블레이드의 마찰저항으로부터 초래되는 저항으로 에어포일의 받음각 변화에 의해서는 현저하게 변하지 않으나, 빠른 속도에서는 로터 블레이드 실속이나 압축성 효과 때문에 증가되는 항력은?","a":[2],"o":["유해항력(Parasite)","유도항력(Induced)","형상항력(Profile)","총 항력(Total drag)"],"e":"기존 문제 : 기초비행원리 선택형 17번"},{"s":"기초비행원리","n":28,"t":"fill","q":"수평선회 시 원심력에 의해 G 부하가 발생하며 15° 표준 선회 시 {}의 동력 증가가 필요하고 30° 선회 시에는 15.4%의 동력증가가 필요하다.","a":["3.6%"],"e":"기존 문제 : 기초비행원리 완성형 25번\n15° → 3.6% / 30° → 15.4%."},{"s":"기초비행원리","n":29,"t":"fill","q":"양력 불균형 현상이 초래하면 퇴진 블레이드의 익근 쪽에서는 회전 속도가 익단에 비해 훨씬 느리기 때문에 전진 속도보다 적어 기류가 후연에서 전연으로 흐르는 곳을 {} 지역이라 한다.","a":["역기류"],"e":"기존 문제 : 기초비행원리 완성형 33번"},{"s":"기초비행원리","n":30,"t":"fill","q":"테일로타 효과 상실(LTE)을 예방하는 방법에 관해 기재하시오.\n가. 풍향 사전 인지, 기수 움직임 발생 시 사전 페달 적용으로 기수 움직임 방지, 급격한 우측(메인로터 반시계방향 회전 항공기) 또는 좌측으로 페달 적용 금지\n나. 제자리비행과 속도 30kt이하 비행 시 배풍 운용 회피\n다. {}\n라. 많은 좌측 또는 우측 페달이 유지되는 상황에서는 특히 주의\n마. 풍속 8~12kt에서 제자리비행 시 풍향 및 풍속 인지 / 주의\n바. 항공기의 방향 변화와 바람 상태 경계, 테일로터 효과 상실을 예방하기 위한 기수 방향 유지","a":["OGE 고도 및 저고도 운용에서 많은 동력이 요구되는 상황 회피"],"k":"write","e":"기존 문제 : 기초비행원리 기재형 42번"},{"s":"항공의학","n":31,"t":"mc","q":"다음 중 비행 착각의 극복책으로 옳지 않은 것은?","a":[2],"o":["계기를 절차에 따라서 Cross check 한다.","머리를 Head-rest에 고정한다.","수직 비행을 한다.","Auto-pilot 장치를 갖추고 있으면 이를 사용한다."],"e":"기존 문제 : 항공의학 선택형 4번"},{"s":"항공기상학","n":32,"t":"mc","q":"안개로 인하여 항공기 이·착륙 시 착륙등과 같은 등화장치 때문에 시각이 제한되는 이유는 무엇 때문인가?","a":[0],"o":["안개의 산란 현상","안개 속에 존재하는 잠열","안개를 구성하고 있는 물방울의 크기","안개와 주변 지역의 기온 차이"],"e":"기존 문제 : 항공기상학 선택형 7번"},{"s":"항공기상학","n":33,"t":"write","q":"실링의 정의와 중요성에 대하여 기재하시오.","a":"최저층의 구름량을 순차적으로 합하여 5/8 이상 시 구름의 높이를 말하며 임무판단의 기준이 된다.","e":"기존 문제 : 항공기상학 기재형 41번\n완성형 38번(BKN 5/8~)과 연결."},{"s":"항공규정","n":34,"t":"mc","q":"휴대용 단말기(H-TAB) 운용 항공기로 시계비행 중 해당 관제기관에 항공기의 위치 보고시간은?","a":[1],"o":["비행금지구역(NFA)에서 매 5분, 한국 전술지대(P-518) 내에서 매 15분","비행금지구역(NFA)에서 매 10분, 한국 전술지대(P-518) 내에서 매 15분","비행금지구역(NFA)에서 매 10분, 한국 전술지대(P-518) 내에서 매 20분","비행금지구역(NFA)에서 매 10분, 한국 전술지대(P-518) 내에서 매 30분"],"e":"기존 문제 : 항공규정 선택형 6번\n95-3규정 선택형 1번(P-518 15분)·10번(회랑 10분)과 연결."},{"s":"항공규정","n":35,"t":"mc","q":"야시경 착용 하 비행 시 시각비행 기상 조건으로 맞는 것은?","a":[1],"o":["시정 1마일, 운고 1,000ft(AGL) 이상","시정 2마일, 운고 1,500ft(AGL) 이상","시정 3마일, 운고 1,500ft(AGL) 이상","시정 5마일, 운고 2,000ft(AGL) 이상"],"e":"기존 문제 : 항공규정 선택형 13번\n※ 문제지에 파란색으로 표시된 문항"},{"s":"항공규정","n":36,"t":"mc","q":"항공기 연료 보급 시 항공기와 급유 차량 간 확보되어야 할 최소 안전거리는?","a":[1],"o":["10ft(3m) 이상","20ft(7m) 이상","30ft(10m) 이상","40ft(13m) 이상"],"e":"기존 문제 : 항공규정 선택형 16번"},{"s":"항공규정","n":37,"t":"fill","q":"항공부대장은 조종사가 아닌 인원이 항공기를 조종할 때에는 주임무 조종사는 {}급 이상이 조종사로 편성하여야 한다.","a":["교관조종사"],"e":"기존 문제 : 항공규정 완성형 27번\n※ 문제지에 파란색으로 표시된 문항"},{"s":"항공규정","n":38,"t":"fill","q":"조종사, 정비사는 항공기 일일검사 결과를 {}에 기록하며, 결함 사항 발견 시 정비중대장(기술검사관)에게 통보하여 조치하고 정비중대장은 결함 및 조치결과를 각각 {}에게 보고한다.","a":["비행기록부","지휘관"],"e":"기존 문제 : 항공규정 완성형 29번"},{"s":"항공규정","n":39,"t":"fill","q":"{}를 통보받은 기관은 그 내용을 지휘관에게 보고하여 필요한 조치를 취하며, {}를 실시한 당사자에 대한 조치는 정상을 참작하여 조치한다. 단, 운용한계 초과에 관한 보고 시 조치절차는 제54조 항공기 운용한계 초과 시 보고 및 조치절차를 적용한다.","a":["자발적 양심보고","자발적 양심보고"],"e":"기존 문제 : 항공규정 완성형 34번"},{"s":"95-3규정","n":40,"t":"mc","q":"(RK)P-518 한국 전술 지대 내 비행 금지구역 비행 시 언제 해당 항공과에 인가요청을 하는가?","a":[2],"o":["1 근무일 전 14시까지","2 근무일 전 14시까지","1 근무일 전 15시까지","2 근무일 전 15시까지"],"e":"기존 문제 : 95-3규정 선택형 3번"},{"s":"95-3규정","n":41,"t":"mc","q":"(RK)P-518 한국 전술 지대 내(비행금지구역 제외)에서 야간비행을 위해 언제까지 중앙관제본부(AMCC)를 통해서 해당 항공과로 승인을 요청해야 하는가?","a":[2],"o":["당일 12시 이전","1근무일 전 12시까지","당일 15시 이전","1근무일 전 15시까지"],"e":"기존 문제 : 95-3규정 선택형 6번"},{"s":"95-3규정","n":42,"t":"fill","q":"비행 금지구역은 북으로는 군사 분계선에서부터 남쪽으로 약 {}에 해당하는 비행금지선을 포함한 지역이다. 설치목적은 비 우호국 간 국경 지대에서 불필요한 {}을 방지하기 위함이다.","a":["5NM(약9.3km)","군사적 마찰"],"e":"기존 문제 : 95-3규정 완성형 19번"},{"s":"95-3규정","n":43,"t":"write","q":"비행금지선이나 군사 분계선의 실제 침범 또는 침범위험 임박을 경고하기 위하여 항공기를 비행 금지구역에서 철수하기 위한 HOT DOG 발령에 대해 기재하시오.\n가. 지상요원 또는 비행 중인 요원에 의해서도 발령될 수 있다.\n나. (          )\n다. HOT DOG 경보가 비행 금지지역 이탈 전 종결되면 자기 항공기 위치를 확인하고, 공역 위반사항이 없음을 확인한 뒤에 계속 임무 수행 가능","a":"HOT DOG 경보발령 시에는 매 30초 간격으로 HOT DOG란 음어에 이어 해당 비행 금지지역 번호와 기수 방향을 긴급 상황이 종료될 때까지 방송된다.","e":"기존 문제 : 95-3규정 기재형 29번\n※ 문제지에 번호가 ‘9.’로 인쇄되어 있으나 29번."}]},
  C:{label:"C안",ready:true,cards:[{"s":"사용자교범","n":1,"t":"mc","q":"항공기의 회전반경은 주륜 착륙 장치의 한 쪽 휠을 중심으로 회전했을 때의 반경으로 10.3m(33.79ft)이며, 주륜과 전륜 착륙 장치의 전후 길이는 4.50m(14.76ft), 좌우 넓이는 바퀴 양 바깥 측면 기준 3.25m(10.66ft)이다. 메인 로터로부터 테일 로터까지의 길이는 얼마인가?","a":[1],"o":["18.00m(59.05ft)","19.05m(62.50ft)","20.00m(65.62ft)","21.00m(68.90ft)"],"e":"기존 문제 : 사용자교범 선택형 3번\n📖 교범 p.2-4\n\n메인 로터~테일 로터 길이 19.05m(62.50ft).\n함께 외울 수치: 회전반경 10.3m / 착륙장치 전후 4.50m / 좌우 3.25m."},{"s":"사용자교범","n":2,"t":"mc","q":"로터 제동장치의 제한사항에 대한 설명이다. 틀린 것은?","a":[2],"o":["비상시를 제외하고 엔진 동력에 의해 로터가 회전하고 있을 때 적용해서는 안된다.","정적제동 위치에서 로터의 회전없이 2개의 엔진 모두 시동이 가능하며 EECU에 의해 엔진은 IDLE 이상 진행되지 않는다.","정상제동은 NR 60% 미만에서 레버를 후방으로 당긴 상태에서 아래로 밀어 동적제동 멈춤쇠까지 밀고 레버를 놓으면 된다.","정적제동 위치에서 항공기 주기 시 45kt 풍속에서 24시간 이상 제동이 유지된다."],"e":"기존 문제 : 사용자교범 선택형 10번\n📖 교범 p.2-71, 2-8-6항 (6번 문제와 비교)\n\n틀린 보기: 다. 정상제동은 엔진 정지 후 NR 50% 미만에서 사용 (완성형 26번).\n옳은 내용: 정적제동 시 두 엔진 시동 가능·EECU가 IDLE 이상 제한, 45kt 풍속에서 24시간 이상 유지."},{"s":"사용자교범","n":3,"t":"mc","q":"메인 기어박스의 신호 시스템은 온도 감지기와 스위치, 압력감지기와 스위치, 철분 탐지기, 통합신호처리장치(ISPU)와 조종실 계기 패널로 구성되어 있는데 비행 중 “MGB TEMP” 주의등이 점등되었다. 가장 적절한 설명은?","a":[1],"o":["메인 기어박스의 유량이 소실되었다.","섬프의 오일 온도가 128°C 이상으로 상승했다.","주 오일펌프의 온도가 128°C 이상으로 상승했다.","각 베어링의 온도가 128°C 이상으로 상승했다."],"e":"기존 문제 : 사용자교범 선택형 15번\n📖 교범 p.2-69, 2-7-3\n온도 감지기는 MGB 하부 섬프에 장착, 섬프 오일온도를 DAU로 송신. 바이메탈식 온도 스위치는 섬프 오일온도 128°C 초과 시 MGB TEMP 점등\n\nMGB TEMP = 섬프 오일 온도 128°C 이상.\n비교: IGB −15°C 이하/110°C 이상, TGB −25°C 이하/94°C 이상."},{"s":"사용자교범","n":4,"t":"mc","q":"다음은 자세 방위 기준장치 및 재형성 유닛(AHRS/RCU) 패널에 대한 설명이다. 잘못 설명하고 있는 것은?","a":[3],"o":["AHRS & RCU ON/OFF 스위치로 최초 전원을 인가하게 되면 피치, 롤, 그리고 방위에 대한 정렬모드가 작동된다.","정렬시간은 지상에서는 약 30초, 공중에서는 약 60초가 소요된다.","정렬모드가 끝나면 자세, 자기 자이로의 방위, 각도 변동률, 선형 가속도, 관성/기압 고도, 관성/기압 상승률, 진대기 속도(TAS), 보정 대기속도(CAS), 그리고 기압 고도가 설정된다.","COMP 스위치는 보정 상태를 선택하는 스위치로써 COMP 등이 지속적으로 점등되어 있으면 보정이 필요함을 의미한다."],"e":"기존 문제 : 사용자교범 선택형 31번\n📖 교범 p.2-49, 2-5-3.2.3 2번항 가·다\nCOMP등의 ‘점멸’은 자기감지기 보정이 필요함을 표시\n\n틀린 보기: 라. 보정이 필요한 상태는 COMP 등 ‘지속 점멸’(32번 나 참고).\n정렬시간: 지상 약 30초, 공중 약 60초."},{"s":"사용자교범","n":5,"t":"mc","q":"엔진 압축기 실속은 통상 ‘쾅’ 또는 ‘펑’하는 큰 소음과 함께 항공기의 편요 현상으로 인지할 수 있다. 엔진 압축기 실속이 일어나면 해당 엔진 계기들의 변동이 일어나는데 옳은 것은?","a":[3],"o":["TGT 변동 없음","NG 변동 없음","MGB P 변동","TGT, T/Q, NP, NG 변동"],"e":"기존 문제 : 사용자교범 선택형 66번\n📖 교범 p.9-9, 9-1-2.13항\n\n압축기 실속 → TGT, T/Q, NP, NG 모두 변동."},{"s":"사용자교범","n":6,"t":"mc","q":"다음 중 연료계통 주의등 점등 시 Land as soon as possible 사항이 아닌 것은 어느 것인가? (복수선택)","a":[0,2],"o":["1 ENG F/FLT 또는 2 ENG F/FLT, 1 F/L FILT 또는 2 F/L FILT 주의등 점등","1 ENG FUEL P, 2 ENG FUEL P 주의등 모두 점등","1 F/L PRES 또는 2 F/L PRES 주의등 점등","1 ENG F/FLT, 2 ENG F/FLT 주의등 모두 또는 1 F/L FILT, 2 F/L FILT 주의등 모두 점등"],"e":"기존 문제 : 사용자교범 선택형 71번\n📖 교범 p.9-13 ~ 14, 9-1-5\n9-1-5.2: F/FLT 또는 F/L FILT 양쪽 ‘모두’ → LAND AS SOON AS POSSIBLE\n9-1-5.7: 1F/L PRES 및 2F/L PRES → BP1·BP2 ON, FUEL P1·P2 확인, LAND AS SOON AS PRACTICABLE\n\n구분 요령: 한쪽만(‘또는’) 점등 → LASAP 아님, 양쪽 ‘모두’ 점등 → LASAP.\n정답: 가, 다."},{"s":"사용자교범","n":7,"t":"fill","q":"항공기 토크감지기의 공차 등을 고려하여 토크가 70kt 이상에서 {}, 70kt 미만에서 {}를 1초 이상 초과하면 HUMS PIP의 ALERTS-EXCEEDANCES 항에 초과 토크와 시간이 기록된다.","a":["TQ 103% (합 TQ 206%)","TQ 114% (합 TQ 228%)"],"e":"기존 문제 : 사용자교범 완성형 19번"},{"s":"사용자교범","n":8,"t":"fill","q":"호이스트 운용 시 기동 제한\n호이스트를 운용하면서 전진 비행할 때 경사각은 최대 {}로 제한한다. 측면 비행은 {}로 제한되며 이는 속도가 증가할수록 감소된다. 후진 비행은 {}로 제한한다. 강하율은 {}으로 제한한다.","a":["25°","25°","35kt","1,000FPM"],"e":"기존 문제 : 사용자교범 완성형 20번\n📖 교범 p.5-12, 5-6-3항 3번\n\n정답은 문제지 각주 순서대로 넣었습니다. 사진상 빈칸 배치가 겹쳐 있어, 각 빈칸과 정답의 짝을 교범에서 한 번 확인하세요."},{"s":"사용자교범","n":9,"t":"fill","q":"계기의 표시(엔진 토크)\n• 두 엔진\n계속 운용(%) {}\n제한 운용(%) 70kt 미만 {} / 35kt 미만 {}\n초과 금지(%) 70kt 이상 {} / 70kt 미만 {} / 35kt 미만 {}\n• 한 엔진\n계속 운용(%) {}\n제한 운용(%) 70kt 미만 {} / 35kt 미만 {}\n초과 금지(%) {}","a":["0~100","101~113(5분)","114~125(20초)","101 이상","114 이상","126 이상","0~144","145~165(2.5분)","166~171(12초)","172 이상"],"e":"기존 문제 : 사용자교범 완성형 27번"},{"s":"사용자교범","n":10,"t":"fill","q":"엔진 NP 한계: 엔진 NP {}에서 {}를 초과하면 엔진이 손상될 수 있다.","a":["105~119%","12초"],"e":"기존 문제 : 사용자교범 완성형 30번"},{"s":"항공기 승무원훈련","n":11,"t":"mc","q":"항공기 승무원 협조란 안전하고 효율적이며 효과적인 임무수행을 위해 항공기 승무원(조종사, 승무병, 비행의무요원 등) 간의 협력적인 상호작용을 말한다. 항공기 승무원 협조 중 ‘원칙’에 대한 요소와 관련이 없는 것은?","a":[3],"o":["조력 제공","행동 통보","인지 행동","브리핑"],"e":"기존 문제 : 항공기 승무원훈련 선택형 3번\n📖 교범 p.1-8~9\n승무원 협조 원칙: 명확한 교신, 조력지시, 행동통보, 조력제공, 인지행동, 명확한 용어사용, 항공기 조종 및 장애물 조언, 행동 순서 및 시기협조(순서와 타이밍)\n승무원 협조 목표: 팀 관계 확립 및 유지, 효율적인 임무 관리, 정보 교환, 교차 감시 수행\n\n원칙 요소: 조력 제공, 행동 통보, 인지 행동 등. 브리핑은 해당 없음."},{"s":"항공기 승무원훈련","n":12,"t":"mc","q":"항공 교통량이 많은 공항지역 등에서는 공중 활주(Air taxi)를 하는 것이 효율적인 경우가 많다. 공중 활주는 필요시 속도·고도 등을 별도로 인가받아 운용할 수 있다. 조종사는 안전한 속도(20kt 이상), 고도를 선택하며 상황에 따라 하강풍, 연료, 경로 등을 고려하여 속도, 고도를 정하는데 특별한 지시가 없는 한 몇 ft 이하에서 하는가?","a":[2],"o":["25ft AGL 이하","50ft AGL 이하","100ft AGL 이하","200ft AGL 이하"],"e":"기존 문제 : 항공기 승무원훈련 선택형 8번\n📖 교범 p.2-75\n\n공중 활주: 20kt 이상, 100ft AGL 이하."},{"s":"항공기 승무원훈련","n":13,"t":"mc","q":"지형 비행간 이, 착륙 제외하고 어느 정도의 고도로 비행하는 것을 말하는가?","a":[2],"o":["AHO 200ft 이하","AHO 150ft 이하","AGL 200ft 이하","AGL 150ft 이하"],"e":"기존 문제 : 항공기 승무원훈련 선택형 13번\n📖 교범 p.2-250\n\n지형비행 = AGL 200ft 이하 (AHO가 아님에 주의)."},{"s":"항공기 승무원훈련","n":14,"t":"mc","q":"항공기 주위의 공역경계에 대해 확실한 감시를 유지하고 있어야 한다. 항공기에 위험을 초래하는 다른 항공기나 장애물 등의 발견 시 즉시 경고하여야 하는데, 경고를 할 때 포함하지 않아도 되는 것은 무엇인가?","a":[1],"o":["방향","속도","거리","고도"],"e":"기존 문제 : 항공기 승무원훈련 선택형 18번\n경고 포함: 방향, 거리, 고도. 속도는 제외."},{"s":"항공기 승무원훈련","n":15,"t":"mc","q":"시계비행 기상조건(VMC) 이륙시에 가속을 위해 필요 이상으로 기수 자세를 숙이지 않도록 주의하여야 한다. 가속을 위해 5°의 Nose down 자세를 권장하고 있다. 운용 간 가급적 초과하지 말아야 하는 각도는 얼마인가?","a":[1],"o":["8°","10°","12°","14°"],"e":"기존 문제 : 항공기 승무원훈련 선택형 23번\n📖 교범 p.2-86\n가속을 위해 최대 5° 기수 숙임 권장, 10° 이상 불필요한 기수 숙임은 고도 침하를 일으키므로 제한\n\n권장 5° / 가급적 10° 초과 금지."},{"s":"항공기 승무원훈련","n":16,"t":"mc","q":"IDMC에 공급하던 항공기 전원을 Off 하기 전에 IDMC의 전원 스위치가 Off 되고 장비의 팬이 정지했는지 확인한다. IDMC 운용 중 회로 차단기로 Off 하거나 MPP의 IDMC 스위치를 Off하고 몇 초 이내 항공기 전원을 차단하면 IDMC의 대용량 전자지도 메모리에 손상을 줄 수 있는가?","a":[0],"o":["5초","10초","30초","60초"],"e":"기존 문제 : 항공기 승무원훈련 선택형 34번\n📖 교범 p.2-215\n\n5초 이내 전원 차단 → 전자지도 메모리 손상."},{"s":"항공기 승무원훈련","n":17,"t":"mc","q":"비행 중 피토관이 얼음으로 막혔다면 영향을 받는 계기는 무엇인가?","a":[2],"o":["속도계","속도계, 고도계","속도계, 고도계, 승강계","고도계, 승강계"],"e":"기존 문제 : 항공기 승무원훈련 선택형 41번\n올해 문제지 정답: 다 (속도계, 고도계, 승강계).\n⚠ 작년 주석본 정답은 가(속도계). 피토관(동압)에는 원리상 속도계가 연결되고 고도계·승강계는 정압을 사용하므로, 올해 정답표를 교관·교범으로 확인하세요."},{"s":"항공기 승무원훈련","n":18,"t":"mc","q":"모든 조종사는 특정 지역에서 지역 고도계 세팅을 활용해야 한다. 그 이유는?","a":[1],"o":["상층부(aloft) 비 표준 온도로 인한 고도계 오차를 상쇄","항공기의 보다 양호한 수직 분리","산악 지형에서 보다 정확한 지형 이격","밀도고도의 보정을 통한 VFR 항공기와의 원활한 분리"],"e":"기존 문제 : 항공기 승무원훈련 선택형 42번\n지역 고도계 세팅 = 보다 양호한 수직 분리."},{"s":"항공기 승무원훈련","n":19,"t":"fill","q":"비행 중 특별하게 명시하지 않았다면 공통적으로 적용되는 표준은 요구되는 기수 방향({})° 유지, 요구되는 고도({}) 유지, 지시속도({})KIAS 유지, 최소한의 편류로 지상 항적 유지, 상승 및 강하율 ±300FPM 유지, 항공기 균형({})Ball 폭 유지이다.","a":["±10","±100ft","±10","±1/2"],"e":"기존 문제 : 항공기 승무원훈련 완성형 48번\n비행 중 공통 표준: 기수 ±10° / 고도 ±100ft / 속도 ±10KIAS / 상승·강하율 ±300FPM / 균형 ±1/2 Ball.\n제자리비행 표준(기재형 4번)은 고도 ±3ft·편류 3ft로 다름."},{"s":"항공기 승무원훈련","n":20,"t":"fill","q":"야간에 비행 전 점검을 어두운 시간에 실시해야 한다면 ({})가 없는 ({})을 사용해야 한다. ({})를 부착한 전등을 사용하면 유압 오일, 일반 오일누출 및 다른 결함을 발견하기 어렵다. 내·외부의 모든 등이 작동하는지 확인한다.","a":["필터","백색전등","색깔이 있는 필터"],"e":"기존 문제 : 항공기 승무원훈련 완성형 50번"},{"s":"항공기 승무원훈련","n":21,"t":"fill","q":"다음은 레이더접근 종류에 대한 설명이다. 괄호에 들어갈 올바른 용어를 쓰시오.\n가. PAR : 조종사에게 정밀한 ({}), ({}), ({})정보를 제공하는 접근 방법\n나. ASR : 조종사에게 ({})와 ({})정보를 제공하고 ({})으로 분류된다.","a":["코스","활공각","거리","코스","거리","비정밀 접근"],"e":"기존 문제 : 항공기 승무원훈련 완성형 60번\nPAR = 코스·활공각·거리(정밀) / ASR = 코스·거리(비정밀). 차이는 ‘활공각’."},{"s":"정비학","n":22,"t":"mc","q":"채프 플레어 발사기(CMDS) 계통은 프로그래머, 디지털 제어 시현 장치(DCDU), 안전스위치 장치(SSU), 좌·우측 발사기 및 좌·우측 발사통으로 구성된다. CMDS는 적의 레이더를 기만하는 채프탄과 적의 미사일 및 적외선 추적 장치를 유인하는 플레어탄으로 적의 위협에 대응하기 위한 장비이다. CMDS는 생존장비 관리컴퓨터(EWC)와 연동하며, 자동/반자동/수동/비상투하(Jettison)/바이패스 발사 기능을 제공하는데 어떠한 인터페이스를 가지고 연동되는가?","a":[1],"o":["ARINC-429","1553B MUX","Internet","Ethernet"],"e":"기존 문제 : 정비학 선택형 3번\n📝 메모\n· 1553B MUX = 군용 인터페이스\n\nCMDS ↔ EWC 연동 = 1553B MUX.\n발사 모드: 자동/반자동/수동/비상투하/바이패스."},{"s":"정비학","n":23,"t":"mc","q":"예비계기 계통은 주 항법계기 결함 시 자세, 속도, 고도, 승강률, 방위 및 시간 정보를 조종사에게 제공하여 항공기의 안정적인 비행을 지원하는 계기이다. 예비계기 계   D:{label:"D안",ready:true,cards:[{"s":"사용자교범","n":1,"t":"fill","q":"2개의 주 유압펌프는 {} 후방 좌·우측 보기류 기어박스에 각각 장착되어 있고 서로 교환이 가능하다. 구동축의 회전력이 피스톤의 왕복운동으로 변환되어 실린더로 들어오는 유압유를 정상 작동 시 {}로 승압한다.","a":["메인 기어박스","2,950 ~ 3,050 PSI"],"e":"기존 문제 : 사용자교범 완성형 7번\n📖 교범 p.2-61, 2-6-1.1항"},{"s":"사용자교범","n":2,"t":"fill","q":"자동조종 컴퓨터(APM)의 각 컴퓨터는 독립적이며 1개의 컴퓨터만으로도 자동비행 기능에 관한 모든 연산 처리와 모든 작동기 조절, 그리고 {}에 정보 시현 등 {}의 완전한 기능을 수행한다. AFCS에 최초 전원이 인가되면 {}가 주 컴퓨터로 작동하고 {}은 예비로서 {}를 감시한다.","a":["MFD","AFCS","APM2","APM1","APM2"],"e":"기존 문제 : 사용자교범 완성형 11번\n📖 교범 p.2-48, 2-5-3.2.2항\n\n최초 전원 인가 시 주 컴퓨터는 APM2, 예비 APM1이 APM2를 감시."},{"s":"사용자교범","n":3,"t":"fill","q":"계기의 표시(HYD 오일 압력, HYD P)\n• 계속 운용(psi) {}\n• 제한 운용(psi) {}, {}\n• 초과 금지(psi) {}","a":["2,700~3,200 psi","2,200~2,700 psi","3,200~3,600 psi","2,200 psi 이하 또는 3,600 psi 이상"],"e":"기존 문제 : 사용자교범 완성형 29번\n문제지의 표를 줄글로 정리했습니다. 선택형 73번: HYD Pump 주의등은 2,200 PSI 이하."},{"s":"사용자교범","n":4,"t":"fill","q":"조종한계 중 금지 기동\n- 초당 {}를 초과하는 {}는 금지한다.\n- 의도적인 {} 또는 {}를 초과하는 조종은 금지한다.\n- 비행 중 양쪽 동력조절장치(PCD)를 {} 위치로 움직이는 것은 금지한다.\n- 연료 승압펌프 작동없이 {}은 금지한다.","a":["60°","제자리 비행 선회","±30° 피치 자세","±60° 롤 자세","동시에 IDLE이나 OFF","30° 이상의 경사비행"],"e":"기존 문제 : 사용자교범 완성형 39번"},{"s":"항공기 승무원훈련","n":5,"t":"fill","q":"항공기 운용간 실시되는 점검 사항 중 최종접근 점검 사항에 대해 기재하시오.\n가. {}\n나. {}\n다. {}","a":["PARKING BRAKE - 필요시 점검","All Instrument - check(속도, 고도, 강하율 등)","착륙장 점검(장애물, 하강풍 영향 등)"],"k":"write","e":"기존 문제 : 항공기 승무원훈련 기재형 6번"},{"s":"정비학","n":6,"t":"fill","q":"테일 기어박스는 중간기어박스로부터 입력되는 회전력을 내부의 피니언과 베벨형 링기어를 통해 {}로 방향을 전환하여 테일 로터를 구동한다. 중간기어박스로부터 전달되는 {}RPM의 회전력은 내부의 베벨 기어에 의해 {}RPM으로 감속된다.","a":["90°","3,875","1,321"],"e":"기존 문제 : 정비학 완성형 8번\n3,875 → 1,321 RPM."},{"s":"정비학","n":7,"t":"fill","q":"연료계통은 연료저장장치, 연료공급/이송장치, 연료량 측정장치, 급·배유장치, 공기 배출장치 및 {}로 구성된다. 연료저장장치는 4개의 연료탱크에 연료 2,187 lb를 저장하고, 주 연료는 JP-8이다. 연료탱크는 12.7mm 철갑소이탄 피탄에 대한 내 탄성을 보유하고 있으며, 추락 시 화재 예방을 위해 자체 밀폐(Self-sealing)기능을 가지고 있다.","a":["탑재형 불활성 가스발생장치(OBIGGS)"],"e":"기존 문제 : 정비학 완성형 11번\n연료 2,187 lb(총량) / JP-8 / 12.7mm."},{"s":"기초비행원리","n":8,"t":"write","q":"전관절형 블레이드는 회전 시 피치각 변화로 블레이드 항력이 변함에 따라 힌지를 축으로 선행과 후행이 일어나는데, 발생 원인에 대해 기재하시오.","a":"회전축을 중심으로 블레이드가 올라간 쪽은 반경이 감소되어 가속되고 반대로 블레이드가 내려간 쪽은 반경이 증가되어 감속한다.","e":"기존 문제 : 기초비행원리 기재형 38번\n올라간 쪽: 반경 ↓ → 가속 / 내려간 쪽: 반경 ↑ → 감속."},{"s":"항공기상학","n":9,"t":"write","q":"차폐(OBS)와 OVC의 차이점에 대해 기재하시오.","a":"차폐는 시정 장애 현상으로 인해 하늘이 보이지 않는 상태, OVC는 운량 8/8으로 하늘 전체에 구름이 덮여 있는 상태를 말한다.","e":"기존 문제 : 항공기상학 기재형 40번"},{"s":"95-3규정","n":10,"t":"fill","q":"H-128 및 회랑 20A로의 모든 비행은 최소 임무 {}까지 승인받아야 한다. 요청계통은 {}를 경유하여 유엔사 군정위 비서처 비서장 승인으로 이루어진다. 유엔사 군사 정전위원회는 H-128로의 모든 비행을 위해 항법사를 지원하며, 항법사는 비무장지대 남쪽 경계선을 횡단하기 전에 {}에서 탑승한다.","a":["7근무일전","미8군항공처","H-127"],"e":"기존 문제 : 95-3규정 완성형 21번"},{"s":"95-3규정","n":11,"t":"fill","q":"비무장지대 월경방지 경고보조물 중 시각경고 신호는?\n가. {}\n나. {}","a":["적/백색 오성 신호탄 및 적/백색 낙하 조명탄, 적색 지상 연막탄","(마지막 수단으로) 5.56밀리 예광탄 발사(의도적인 조준사격 금지)"],"k":"write","e":"기존 문제 : 95-3규정 기재형 28번"}]},
  E:{label:"E안",ready:true,cards:[{"s":"사용자교범","n":1,"t":"mc","q":"아래 설명문에 해당하는 문구는 무엇인가?\n“운용 절차 수행 시 이 지침이 정확하게 지켜지지 않을 경우 장비의 파손과 기능 수행의 차질을 초래할 수 있는 경우”","a":[1],"o":["경고(Warning)","주의(Caution)","주(Note)","참고(Reference)"],"e":"기존 문제 : 사용자교범 선택형 1번\n📖 교범 p.1-1, 1-2-1\n경고: 지키지 않으면 인원의 건강저하·위험·부상·사망 초래\n주의: 장비의 파손과 기능 수행의 차질 초래\n주(注): 필수사항을 보충하여 중요한 정보를 추가·강조\n\n핵심어는 ‘장비의 파손’과 ‘기능 수행의 차질’ → 주의(Caution)."},{"s":"사용자교범","n":2,"t":"fill","q":"로터 시동 및 정지 한계: 엔진 시동으로 로터를 회전시키거나 엔진 정지로 로터를 정지시킬 수 있는 최대 풍속은 정풍 {}, 측풍 {}, 배풍 {}이다.","a":["45 kt","30 kt","25 kt"],"e":"기존 문제 : 사용자교범 완성형 25번\n정풍 45 / 측풍 30 / 배풍 25 (5씩 줄지 않음에 주의)."},{"s":"사용자교범","n":3,"t":"fill","q":"계기의 표시(엔진 토크)\n• 두 엔진\n계속 운용(%) {}\n제한 운용(%) 70kt 미만 {} / 35kt 미만 {}\n초과 금지(%) 70kt 이상 {} / 70kt 미만 {} / 35kt 미만 {}\n• 한 엔진\n계속 운용(%) {}\n제한 운용(%) 70kt 미만 {} / 35kt 미만 {}\n초과 금지(%) {}","a":["0~100","101~113(5분)","114~125(20초)","101 이상","114 이상","126 이상","0~144","145~165(2.5분)","166~171(12초)","172 이상"],"e":"기존 문제 : 사용자교범 완성형 27번"},{"s":"사용자교범","n":4,"t":"fill","q":"엔진 NP 한계: 엔진 NP {}에서 {}를 초과하면 엔진이 손상될 수 있다.","a":["105~119%","12초"],"e":"기존 문제 : 사용자교범 완성형 30번"},{"s":"사용자교범","n":5,"t":"fill","q":"한 엔진 고장절차\n- 작동 중인 엔진의 동력을 최대한 확보하기 위해 {} 및 {}는 OFF 해야 한다.\n- 우선 중요한 것은 조종사가 한 엔진 고장을 인지하는 것과 그에 따른 비상조치이다. 저고도 저속에서는 컬렉티브를 내려서 NR을 {}하는 것이 가장 중요하다.\n- 고고도에서는 컬렉티브를 충분히 내려서 NR을 {}시켜야 한다. 지면효과를 받고 있는 제자리비행의 경우에는 유연한 착륙에 필요한 만큼만 컬렉티브를 사용하며 이때 주 고려사항은 {}하는 것이다.","a":["엔진방빙장치","ECS의 히터","정상범위로 유지","100%로 증가","항공기의 자세를 수평으로 유지"],"e":"기존 문제 : 사용자교범 완성형 44번\n저고도 = NR 정상범위 유지 / 고고도 = NR 100%로 증가."},{"s":"사용자교범","n":6,"t":"fill","q":"표준화를 위해 비상절차에 사용되는 용어에 대하여 기재하시오.\n가. LAND AS SOON AS POSSIBLE : {}\n나. LAND AS SOON AS PRACTICABLE : {}","a":["지체없이 가장 가깝고 착륙 가능한 장소에 착륙한다. (주된 고려사항은 탑승자의 생존)","착륙이 적절한 장소에 착륙한다. (주된 고려사항은 상황의 긴급성)"],"k":"write","e":"기존 문제 : 사용자교범 기재형 1번\nPOSSIBLE = 생존, 가장 가까운 곳 / PRACTICABLE = 긴급성, 적절한 곳 (선택형 64번)."},{"s":"사용자교범","n":7,"t":"fill","q":"MGB TEMP 주의등 점등시 원인과 조치사항을 기재하시오.\n- {} 또는 {}이 원인일 수 있다. MGB TEMP 주의등이 5분 이상 계속 점등될 경우 두 엔진 토크는 55% 이하를 유지해야 한다.\n- 조치절차\n1. 속도 - {}\nMGB TEMP 주의등이 {} 계속 점등될 경우\n2. {}\nMGB TEMP 주의등이 소등될 경우\n3. {}","a":["MGB 오일량 부족","오일냉각장치의 고장","75KIAS 이하로 조절","5분 이상","LAND AS SOON AS PRACTICABLE","계속비행"],"k":"write","e":"기존 문제 : 사용자교범 기재형 10번"},{"s":"항공기 승무원훈련","n":8,"t":"mc","q":"항공기 승무원 협조를 위한 필수 요소 중 조력 제공에 해당하지 않는 것은?","a":[3],"o":["조종간을 잡고 있는 조종사가 항공기로 어려운 비행 시범 또는 정상 조작 중 예상된 상황에서 벗어날 때","어느 때라도 정보나 조력이 요청될 때","어느 때라도 조종사나 항공기 승무원이 어떤 비행 장애물로 야기되는 사항을 보거나 인식했을 때","조종사나 항공기 승무원이 다른 사람의 도움 없이 자신의 능력으로 항공기를 조종하거나 고장에 대한 조치를 취할 수 없을 때"],"e":"기존 문제 : 항공기 승무원훈련 선택형 5번\n📖 교범 p.1-9\n조력 지시(p.1-8): 승무원은 자신이 더 이상 다른 승무원의 도움 없이 항공기를 조종하거나 고장 조치를 취할 수 없을 때 직접 도움을 요청해야 한다. P*가 계기 교차점검을 위해 주시를 외부에서 내부로 전환할 때도 조력을 요청 (→ 라는 조력 ‘지시’에 해당)\n\n정답: 라."},{"s":"항공기 승무원훈련","n":9,"t":"mc","q":"계기비행(IFR) 비행계획을 할 경우 위험한 기상상태를 회피하기 위한 항로 및 고도를 선정하되 항공기나 장비 제한사항을 초과하지 않도록 하고 비행 정보 간행물(FLIP)에 따라서 계기비행(IFR) 순항 고도에서 수행하며 이탈항로 허용 오차는 계산된 코스에서 얼마 이내인가?","a":[0],"o":["±5°","±10°","±15°","±20°"],"e":"기존 문제 : 항공기 승무원훈련 선택형 15번\n📖 교범 p.2-172\n\nIFR 이탈항로 허용 오차 ±5°."},{"s":"항공기 승무원훈련","n":10,"t":"mc","q":"최대 가용동력(MTA)을 구할 때 쌍발엔진(AEO)일 경우와 단발엔진(OEI)일 경우에 참조하는 각각의 제한도표는 무엇인가?","a":[2],"o":["30분 도표 / 10분 도표","30분 도표 / 2.5분 도표","10분 도표 / 2.5분 도표","2.5분 도표 / 10분 도표"],"e":"기존 문제 : 항공기 승무원훈련 선택형 16번\n📖 교범 p.2-31\n\nAEO = 10분 도표 / OEI = 2.5분 도표."},{"s":"항공기 승무원훈련","n":11,"t":"mc","q":"야간 시계비행 기상조건(VMC) 접근시에는 고도, 분명한 대지속도(G/S) 및 접근율의 판단이 어렵다. 다음 중 옳은 것은 무엇인가?","a":[2],"o":["최종 접근지점 100ft까지 강하율은 주간보다는 약간 많게 유지한다.","장애물 이하 고도로 강하한 이후에 인공조명 사용이 필요한지를 결정하여야 한다.","접근속도와 접근율이 현저하게 증가 될 때까지 접근속도를 약 50kt까지 서서히 줄일 수 있다.","탐조등의 사용은 몇 분 동안 야간시력을 약화시키게 된다."],"e":"기존 문제 : 항공기 승무원훈련 선택형 26번\n📖 교범 p.2-99\n가) 마지막 100ft 강하율은 주간보다 약간 ‘적게’ 유지. 접근속도·접근율이 현저히 증가될 때까지 접근속도를 약 50kt까지 서서히 줄일 수 있음 나) 장애물 이하 고도로 강하 ‘이전에’ 인공조명 사용 필요 여부 결정 다) 탐조등·착륙등(백색등)은 즉시 사용 가능하게 조절, 백색등 사용은 몇 분 동안 야간시력 약화\n\n정답: 다 (약 50kt까지 서서히 감속)."},{"s":"항공기 승무원훈련","n":12,"t":"mc","q":"지형비행 항법 간의 표준 절차로 옳지 않은 것은 무엇인가?","a":[2],"o":["초저고도비행(NOE,   ["B","C","D","E"].forEach(k=>SETS[k].cards.forEach(c=>{const key=(c.e||c.q).split("\n")[0]+"|"+c.q;
    if(seen.has(key))seen.get(key).src.push(SETS[k].label);else{const x={...c,src:[SETS[k].label]};seen.set(key,x);all.push(x)}}));
  const ord=s=>{const i=SUBJ_ORDER.indexOf(s);return i<0?99:i};
  all.sort((a,b)=>ord(a.s)-ord(b.s));all.forEach((c,i)=>c.n=i+1);SETS.ALL.cards=all})();
const srcTag=c=>c.src?`<span class="kind settag">${c.src.join("·")}</span>`:"";

/* ===== util ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const K=["가","나","다","라","마"];
const TYPE={mc:"선택형",fill:"완성형",write:"기재형"};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add("hidden"),2000)}
const norm=s=>String(s).toLowerCase().replace(/[\s·.,()\-–~℃°%]/g,"");
const subjects=cards=>{const m=new Map();cards.forEach(c=>{if(!m.has(c.s))m.set(c.s,[]);m.get(c.s).push(c)});
  return [...m.entries()].sort((a,b)=>{const ia=SUBJ_ORDER.indexOf(a[0]),ib=SUBJ_ORDER.indexOf(b[0]);return (ia<0?99:ia)-(ib<0?99:ib)})};
const ansStr=c=>c.t==="mc"?c.a.map(i=>`${K[i]}. ${c.o[i]}`).join(" / "):Array.isArray(c.a)?c.a.join(" / "):c.a;

/* 확인 창 (앱 화면 안에서 띄움) */
function ask(msg,yes,onYes){const m=$("#modal");$("#mdMsg").textContent=msg;$("#mdYes").textContent=yes||"확인";m.classList.remove("hidden");$("#mdYes").focus();
  const close=()=>m.classList.add("hidden");$("#mdNo").onclick=close;m.onclick=e=>{if(e.target===m)close()};$("#mdYes").onclick=()=>{close();onYes()}}

/* ===== state ===== */
let cur=LS.get("kes.set","B");if(!SETS[cur]||!SETS[cur].ready)cur="B";
let mode=LS.get("kes.mode","book");
let hideAns=LS.get("kes.hide",false);
let exam=null; // {set, answers:{idx:val}, start, elapsed, done, self:{idx:bool}}
let filterWrong=false;
let shuf=LS.get("kes.shuf",false);
function newExam(){const n=SETS[cur].cards.length;let order=null;
  if(shuf){order=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
  return {set:cur,answers:{},elapsed:0,done:false,order}}

/* ===== tabs ===== */
function renderTabs(){
  $("#sets").innerHTML=Object.entries(SETS).map(([k,v])=>`<button role="tab" data-k="${k}" aria-selected="${k===cur}" ${v.ready?"":"disabled"}>${v.label}<span>${v.ready?(v.cards.length?v.cards.length+"문항":"입력 전"):"미입수"}</span></button>`).join("");
  $("#sets").querySelectorAll("button").forEach(b=>b.onclick=()=>{const go=()=>{if(exam&&!exam.done&&exam.resumeAt){exam.elapsed+=(Date.now()-exam.resumeAt)/1000;exam.resumeAt=null;saveExam()}cur=b.dataset.k;LS.set("kes.set",cur);exam=null;render()};
    if(exam&&!exam.done&&mode==="exam"&&exam.set!==b.dataset.k)ask("진행 중인 시험이 있어요. 다른 안으로 이동할까요? 답안은 저장돼요.","이동",go);else go()});
  const n=SETS[cur].cards.length;$("#setInfo").textContent=n?`${SETS[cur].label} · ${n}문항`:"";
}
$("#modes").querySelectorAll("button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;LS.set("kes.mode",mode);render()});

/* ===== CP/P 기준 점검 ===== */
function stdCheck(cards){const cnt={};cards.forEach(c=>cnt[c.s]=(cnt[c.s]||0)+1);
  const names=[...new Set([...Object.keys(STD),...Object.keys(cnt)])].sort((a,b)=>{const ia=SUBJ_ORDER.indexOf(a),ib=SUBJ_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)});
  let diff=0;const rows=names.map(s=>{const have=cnt[s]||0,need=STD[s]||0;const d=have-need;if(d)diff++;
    return `<tr><td>${esc(s)}</td><td>${need}</td><td>${have}</td><td class="${d<0?"short":d>0?"over":"okc"}">${d<0?`${-d}개 부족`:d>0?`${d}개 많음`:"✓"}</td></tr>`}).join("");
  return {diff,html:`<table class="std"><tr><th>과목</th><th>기준</th><th>입력</th><th></th></tr>${rows}<tr class="sum"><td>합계</td><td>${STD_TOTAL}</td><td>${cards.length}</td><td class="${cards.length<STD_TOTAL?"short":cards.length>STD_TOTAL?"over":"okc"}">${cards.length===STD_TOTAL?"✓":cards.length<STD_TOTAL?`${STD_TOTAL-cards.length}개 부족`:`${cards.length-STD_TOTAL}개 많음`}</td></tr></table>`}}

/* ===== 자료집 ===== */
function qHTML(c,idx,showAns,num){
  let h=`<p class="qt"><span class="no">${num||c.n}.</span>`;
  if(c.t==="fill"){const p=c.q.split("{}");h+=p.map((x,i)=>esc(x)+(i<p.length-1?`<span class="blank ${showAns?"show":""}">${showAns?esc(c.a[i]):"&nbsp;"+(K[i]||"")+"&nbsp;"}</span>`:"")).join("")}
  else h+=esc(c.q);
  h+=`<span class="kind">${TYPE[c.k||c.t]}</span>${srcTag(c)}</p>`;
  if(c.t==="mc")h+=`<ol class="ch">${c.o.map((o,i)=>`<li class="${showAns&&c.a.includes(i)?"right":""}"><span class="k">${K[i]}.</span><span>${esc(o)}${showAns&&c.a.includes(i)?" ✓":""}</span></li>`).join("")}</ol>`;
  if(showAns){h+=`<div class="ans"><b>정답</b> ${esc(ansStr(c))}</div>`;if(c.e)h+=`<div class="note">${esc(c.e)}</div>`}
  return h;
}
function renderBook(){
  const set=SETS[cur];const v=$("#view");
  if(!set.cards.length){v.innerHTML=`<div class="empty"><b>${set.label} 문제를 아직 넣지 않았어요</b>문제지와 정답표 사진을 보내주시면 이 자리에 채워져요.</div>`;return}
  const open=LS.get("kes.open."+cur,null);
  const ck=stdCheck(set.cards);
  let h=cur==="ALL"?`<p class="allnote">B~E안 문제를 과목별로 모았어요. 문제 뒤의 표시로 어느 안 문제인지 알 수 있어요.</p><div class="bar"><span>과목을 눌러 펼치고 접을 수 있어요</span><button class="switch" id="hideSw" aria-pressed="${hideAns}"><i></i>정답 가리기</button></div>`:`<details class="stdbox" ${LS.get("kes.stdopen",false)?"open":""}><summary>CP/P 기준 문항 점검 ${ck.diff||set.cards.length!==STD_TOTAL?`<span class="warn">${set.cards.length}/${STD_TOTAL}문항</span>`:`<span class="good">50/50 ✓</span>`}</summary>${ck.html}</details>
  <div class="bar"><span>과목을 눌러 펼치고 접을 수 있어요</span><button class="switch" id="hideSw" aria-pressed="${hideAns}"><i></i>정답 가리기</button></div>`;
  subjects(set.cards).forEach(([s,cs],si)=>{
    const isOpen=open?open.includes(s):si===0;
    h+=`<details class="subj" data-s="${esc(s)}" ${isOpen?"open":""}><summary>${esc(s)}<small>${cs.length}문항</small></summary><div class="qs">`;
    cs.forEach(c=>{const i=set.cards.indexOf(c);h+=`<div class="q" data-i="${i}">${qHTML(c,i,!hideAns)}${hideAns?`<button class="reveal">정답 보기</button>`:""}</div>`});
    h+=`</div></details>`;
  });
  v.innerHTML=h;
  if(v.querySelector(".stdbox"))v.querySelector(".stdbox").addEventListener("toggle",e=>LS.set("kes.stdopen",e.target.open));
  $("#hideSw").onclick=()=>{hideAns=!hideAns;LS.set("kes.hide",hideAns);renderBook()};
  v.querySelectorAll("details.subj").forEach(d=>d.addEventListener("toggle",()=>{LS.set("kes.open."+cur,[...v.querySelectorAll("details.subj[open]")].map(x=>x.dataset.s))}));
  v.querySelectorAll(".reveal").forEach(b=>b.onclick=()=>{const q=b.closest(".q"),c=set.cards[+q.dataset.i];q.innerHTML=qHTML(c,+q.dataset.i,true)});
}

/* ===== 실전 시험 ===== */
const fmt=s=>{s=Math.floor(s);const m=Math.floor(s/60),x=s%60;return (m>=60?Math.floor(m/60)+":"+String(m%60).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
let tick=null;
function saveExam(){if(exam)LS.set("kes.exam."+exam.set,exam)}
function renderExam(){
  const set=SETS[cur],v=$("#view");clearInterval(tick);
  if(!set.cards.length){v.innerHTML=`<div class="empty"><b>${set.label} 문제를 아직 넣지 않았어요</b>문제가 채워지면 실제 시험처럼 풀고 채점할 수 있어요.</div>`;return}
  if(!exam){const saved=LS.get("kes.exam."+cur,null);if(saved&&!saved.done)exam=saved}
  if(!exam||exam.set!==cur){return renderStart()}
  if(exam.done)return renderResult();
  // 풀이 화면
  exam.resumeAt=Date.now();
  let h=`<div class="exbar"><span class="t" id="clock">${fmt(exam.elapsed)}</span><span class="p" id="prog"></span><button id="submit">제출하고 채점</button></div>`;
  const ORD=exam.order||set.cards.map((_,i)=>i);
  ORD.forEach((i,pos)=>{const c=set.cards[i];const num=exam.order?pos+1:c.n;
    const a=exam.answers[i];
    h+=`<div class="eq" id="q${i}"><div class="sj">${esc(c.s)}</div>`;
    if(c.t==="fill"){const p=c.q.split("{}");h+=`<p class="qt"><span class="no">${num}.</span>${p.map((x,j)=>esc(x)+(j<p.length-1?`<span class="blank">&nbsp;${K[j]}&nbsp;</span>`:"")).join("")}<span class="kind">${TYPE[c.k||c.t]}</span>${srcTag(c)}</p>
      <div class="inp">${c.a.map((_,j)=>`<label>${K[j]} <input data-i="${i}" data-j="${j}" value="${esc((a&&a[j])||"")}" autocomplete="off" aria-label="${num}번 빈칸 ${K[j]}"></label>`).join("")}</div>`}
    else if(c.t==="mc"){h+=`<p class="qt"><span class="no">${num}.</span>${esc(c.q)}${c.a.length>1?`<span class="kind">${c.a.length}개 고르기</span>`:""}${srcTag(c)}</p><div class="omr">${c.o.map((o,j)=>`<button data-i="${i}" data-j="${j}" aria-pressed="${!!(a&&a.includes(j))}"><span class="bub">${K[j]}</span><span>${esc(o)}</span></button>`).join("")}</div>`}
    else{h+=`<p class="qt"><span class="no">${num}.</span>${esc(c.q)}<span class="kind">${TYPE[c.t]}</span>${srcTag(c)}</p><div class="inp"><textarea data-i="${i}" placeholder="답을 적어 보세요. 제출 후 모범답안과 비교해 스스로 채점해요.">${esc(a||"")}</textarea></div>`}
    h+=`</div>`;
  });
  h+=`<button class="primary" id="submit2">제출하고 채점</button><button class="ghost" id="quit">시험 중단 (답안 저장)</button>`;
  v.innerHTML=h;
  const prog=()=>{const n=set.cards.filter((c,i)=>{const a=exam.answers[i];return c.t==="mc"?a&&a.length:c.t==="fill"?a&&a.some(x=>x&&x.trim()):a&&a.trim()}).length;$("#prog").textContent=`${n} / ${set.cards.length} 답함`};prog();
  v.querySelectorAll(".omr button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=+b.dataset.j,c=set.cards[i];let a=exam.answers[i]||[];
    if(c.a.length>1){a=a.includes(j)?a.filter(x=>x!==j):[...a,j]}else a=a.includes(j)?[]:[j];
    exam.answers[i]=a;b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",a.includes(+x.dataset.j)));saveExam();prog()});
  v.querySelectorAll(".inp input").forEach(inp=>inp.oninput=()=>{const i=+inp.dataset.i;const a=exam.answers[i]||[];a[+inp.dataset.j]=inp.value;exam.answers[i]=a;saveExam();prog()});
  v.querySelectorAll(".inp textarea").forEach(ta=>ta.oninput=()=>{exam.answers[+ta.dataset.i]=ta.value;saveExam();prog()});
  const submit=()=>{const left=set.cards.length-set.cards.filter((c,i)=>exam.answers[i]&&(Array.isArray(exam.answers[i])?exam.answers[i].some(x=>x!==""&&x!==undefined):String(exam.answers[i]).trim())).length;
    const doIt=()=>{exam.elapsed+=(Date.now()-exam.resumeAt)/1000;exam.done=true;exam.self={};grade();saveExam();clearInterval(tick);window.scrollTo(0,0);renderResult()};
    if(left)ask(`아직 답하지 않은 문제가 ${left}개 있어요. 그래도 제출하고 채점할까요?`,"제출",doIt);else doIt()};
  $("#submit").onclick=submit;$("#submit2").onclick=submit;
  $("#quit").onclick=()=>{exam.elapsed+=(Date.now()-exam.resumeAt)/1000;saveExam();exam=null;window.scrollTo(0,0);renderStart(true)};
  tick=setInterval(()=>{const el=$("#clock");if(!el){clearInterval(tick);return}el.textContent=fmt(exam.elapsed+(Date.now()-exam.resumeAt)/1000);
    if(Math.random()<.1){const e2={...exam,elapsed:exam.elapsed+(Date.now()-exam.resumeAt)/1000,resumeAt:Date.now()};LS.set("kes.exam."+exam.set,e2)}},1000);
}
function renderStart(paused){
  const set=SETS[cur],v=$("#view");
  const saved=LS.get("kes.exam."+cur,null);const hist=LS.get("kes.hist."+cur,[]);
  const ck=stdCheck(set.cards);
  v.innerHTML=`<div class="start"><h2>${set.label} 실전 시험</h2>${cur==="ALL"?`<p>B~E안 문제를 한데 모았어요. 여러 안에 나온 문제는 한 번만 들어가고, 문제 뒤에 어느 안 문제인지 표시돼요.</p>
    <table class="std"><tr><th>과목</th><th>문항</th></tr>${subjects(set.cards).map(([s,cs])=>`<tr><td>${esc(s)}</td><td>${cs.length}</td></tr>`).join("")}<tr class="sum"><td>합계</td><td>${set.cards.length}</td></tr></table>`
    :`<p>CP/P 조종자격 필기평가(50문항)예요. 모든 문항을 풀고, 제출하면 바로 채점돼요. 기재형은 제출 후 모범답안과 비교해 스스로 채점해요.</p>
    ${ck.html}${set.cards.length<STD_TOTAL?`<p class="warnp">아직 ${STD_TOTAL-set.cards.length}문항이 입력되지 않았어요. 지금 시험은 입력된 ${set.cards.length}문항으로 채점돼요.</p>`:""}`}
    <div class="ordsw" role="group" aria-label="문제 순서"><span>문제 순서</span><button data-o="q" aria-pressed="${!shuf}">In Order</button><button data-o="s" aria-pressed="${shuf}">Shuffle</button></div>
    ${saved&&!saved.done?`<button class="primary" id="resume">이어서 풀기 (${fmt(saved.elapsed)} 진행)</button><button class="ghost" id="fresh">처음부터 새로 풀기</button>`:`<button class="primary" id="fresh">시험 시작</button>`}
    ${hist.length?`<div class="hist"><b>지난 기록</b><ul>${hist.slice(-5).reverse().map(r=>`<li>${r.d} · ${r.score}점 (${r.ok}/${r.total}) · ${fmt(r.t)}</li>`).join("")}</ul></div>`:""}</div>`;
  const r=$("#resume");if(r)r.onclick=()=>{exam=saved;renderExam()};
  v.querySelectorAll(".ordsw button").forEach(b=>b.onclick=()=>{shuf=b.dataset.o==="s";LS.set("kes.shuf",shuf);v.querySelectorAll(".ordsw button").forEach(x=>x.setAttribute("aria-pressed",(x.dataset.o==="s")===shuf))});
  $("#fresh").onclick=()=>{const go=()=>{exam=newExam();saveExam();window.scrollTo(0,0);renderExam()};
    if(saved&&!saved.done)ask("저장된 답안을 지우고 처음부터 새로 시작할까요?","새로 시작",go);else go()};
  if(paused)toast("답안을 저장했어요");
}
function isRight(c,a){
  if(c.t==="mc"){a=a||[];return a.length===c.a.length&&c.a.every(x=>a.includes(x))}
  if(c.t==="fill"){a=a||[];return c.a.every((x,j)=>a[j]&&String(x).split("|").some(alt=>norm(alt)===norm(a[j])))}
  return null; // write: self-graded
}
function grade(){const set=SETS[exam.set];exam.res=set.cards.map((c,i)=>isRight(c,exam.answers[i]))}
function totals(){const set=SETS[exam.set];let ok=0,pend=0;const by={};
  set.cards.forEach((c,i)=>{const r=c.t==="write"?exam.self[i]:exam.res[i];const b=by[c.s]||(by[c.s]={ok:0,n:0});b.n++;
    if(r===true){ok++;b.ok++}else if(r===undefined||r===null)pend++});
  return {ok,pend,total:set.cards.length,by}}
function renderResult(){
  const set=SETS[exam.set],v=$("#view");const T=totals();const score=Math.round(T.ok/T.total*100);
  let h=`<div class="score"><div class="big">${score}<small>점</small></div><div class="meta">${T.ok} / ${T.total} 정답 · 소요 ${fmt(exam.elapsed)}${T.pend?` · 기재형 ${T.pend}문항 채점 대기`:""}</div></div>`;
  h+=`<table class="bysub"><tr><th>과목</th><th>정답</th><th>정답률</th></tr>${subjects(set.cards).map(([s])=>{const b=T.by[s];return `<tr><td>${esc(s)}</td><td>${b.ok}/${b.n}</td><td>${Math.round(b.ok/b.n*100)}%</td></tr>`}).join("")}</table>`;
  h+=`<div class="filter"><button data-f="all" aria-pressed="${!filterWrong}">전체 문항</button><button data-f="wrong" aria-pressed="${filterWrong}">틀린 문항만</button></div><div id="rlist"></div>
    <button class="primary" id="again">${set.label} 다시 풀기</button><button class="ghost" id="retryWrong">틀린 문항만 다시 풀기</button><button class="ghost" id="toStart">시험 첫 화면으로</button>`;
  v.innerHTML=h;
  const list=()=>{let r="";(exam.order||set.cards.map((_,i)=>i)).forEach((i,pos)=>{const c=set.cards[i];const res=c.t==="write"?exam.self[i]:exam.res[i];if(filterWrong&&res===true)return;
    const a=exam.answers[i];let mine="";
    if(c.t==="mc")mine=a&&a.length?a.map(j=>K[j]).join(", "):"(답 안 함)";
    else if(c.t==="fill")mine=a&&a.some(x=>x)?c.a.map((_,j)=>`${K[j]} ${a[j]||"—"}`).join(" / "):"(답 안 함)";
    else mine=a&&a.trim()?a:"(답 안 함)";
    r+=`<div class="rq ${res===true?"ok":""}" data-i="${i}"><div class="sj" style="font-size:.75rem;color:var(--sub)">${esc(c.s)} · <span class="mark ${res===true?"o":res===false?"x":""}">${res===true?"정답":res===false?"오답":"채점 대기"}</span></div>${qHTML(c,i,true,exam.order?pos+1:null)}
      <div class="mine">내 답: ${esc(mine)}</div>
      ${c.t==="write"?`<div class="self"><button class="o" data-v="1" aria-pressed="${exam.self[i]===true}">맞았어요</button><button class="x" data-v="0" aria-pressed="${exam.self[i]===false}">틀렸어요</button></div>`:""}</div>`});
    $("#rlist").innerHTML=r||`<div class="empty"><b>틀린 문항이 없어요</b>모든 문항을 맞혔어요.</div>`;
    $("#rlist").querySelectorAll(".self button").forEach(b=>b.onclick=()=>{const i=+b.closest(".rq").dataset.i;exam.self[i]=b.dataset.v==="1";saveExam();logHist();renderResult()})};
  list();
  v.querySelectorAll(".filter button").forEach(b=>b.onclick=()=>{filterWrong=b.dataset.f==="wrong";renderResult()});
  $("#again").onclick=()=>{exam=newExam();saveExam();window.scrollTo(0,0);renderExam()};
  $("#retryWrong").onclick=()=>{const keep={};set.cards.forEach((c,i)=>{const r=c.t==="write"?exam.self[i]:exam.res[i];if(r===true)keep[i]=exam.answers[i]});
    exam=newExam();exam.answers=keep;saveExam();window.scrollTo(0,0);renderExam();toast("맞힌 문항은 답을 남겨 뒀어요")};
  $("#toStart").onclick=()=>{exam=null;renderStart()};
  logHist();
}
function logHist(){const T=totals();const hist=LS.get("kes.hist."+exam.set,[]);const id=exam.id||(exam.id=Date.now());
  const rec={id,d:new Date(id).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"}),score:Math.round(T.ok/T.total*100),ok:T.ok,total:T.total,t:exam.elapsed};
  const k=hist.findIndex(r=>r.id===id);if(k>=0)hist[k]=rec;else hist.push(rec);LS.set("kes.hist."+exam.set,hist.slice(-20));saveExam()}

/* ===== render ===== */
function render(){renderTabs();$("#modes").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mode));
  if(mode==="book"){clearInterval(tick);if(exam&&!exam.done&&exam.resumeAt){exam.elapsed+=(Date.now()-exam.resumeAt)/1000;exam.resumeAt=null;saveExam()}renderBook()}else renderExam()}
render();
</script>
</body>
</html>
